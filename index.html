<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conscientização sobre o Desmatamento</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <button id="toggle-theme">Alternar Tema</button>
  </header>

  <main class="container">
    <h1>Preserve a Nossa Floresta</h1>
    <p>O desmatamento ameaça a biodiversidade, o clima e o futuro do nosso planeta. A conscientização é o primeiro passo para a mudança.</p>
    
    <div class="card">
      <img src="https://images.unsplash.com/photo-1511497584788-876761c119ef?auto=format&fit=crop&w=800&q=80" alt="Floresta preservada">
      <div class="card-content">
        <h2>Juntos Pela Natureza</h2>
        <p>Apoie ações de reflorestamento e combate ao desmatamento ilegal.</p>
        <button id="like-btn">❤️ Curtir (<span id="like-count">0</span>)</button>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
