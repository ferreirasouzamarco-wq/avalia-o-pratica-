<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preservação Ambiental - Desmatamento Zero</title>
  <style>
    /* VARIÁVEIS DE TEMA */
    :root {
      --bg-color: #f4f9f4;
      --text-color: #1b4332;
      --card-bg: #ffffff;
      --button-bg: #2d6a4f;
      --button-text: #ffffff;
      --shadow: rgba(0, 0, 0, 0.1);
    }

    body.dark-mode {
      --bg-color: #121212;
      --text-color: #e0e0e0;
      --card-bg: #1e1e1e;
      --button-bg: #52b788;
      --button-text: #121212;
      --shadow: rgba(0, 0, 0, 0.5);
    }

    /* ESTILOS GERAIS */
    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 20px;
      transition: background-color 0.3s, color 0.3s;
    }

    header {
      display: flex;
      justify-content: flex-end;
      max-width: 800px;
      margin: 0 auto 20px auto;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      text-align: center;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 12px var(--shadow);
      margin-top: 20px;
      transition: background-color 0.3s;
    }

    .card img {
      width: 100%;
      height: 350px;
      object-fit: cover;
      display: block;
    }

    .card-content {
      padding: 25px;
    }

    /* BOTOES */
    button {
      background-color: var(--button-bg);
      color: var(--button-text);
      border: none;
      padding: 12px 24px;
      border-radius: 25px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      transition: opacity 0.2s, transform 0.1s;
    }

    button:hover {
      opacity: 0.9;
    }

    button:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <header>
    <button id="toggle-theme">☀️ Modo Escuro</button>
  </header>

  <main class="container">
    <h1>Preserve a Nossa Floresta</h1>
    <p>O desmatamento reduz a biodiversidade, afeta o clima global e compromete o futuro. Ações de conscientização e reflorestamento são urgentes.</p>
    
    <div class="card">
      <img src="https://images.unsplash.com/photo-1511497584788-876761c119ef?auto=format&fit=crop&w=800&q=80" alt="Floresta tropical preservada com árvores altas">
      <div class="card-content">
        <h2>Proteja o Meio Ambiente</h2>
        <p>Apoie causas ambientais e ajude a espalhar a mensagem contra o desmatamento ilegal.</p>
        <button id="like-btn">❤️ Curtir (<span id="like-count">0</span>)</button>
      </div>
    </div>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // 1. FUNCIONALIDADE DO BOTÃO DE TEMA (CLARO/ESCURO)
      const toggleThemeBtn = document.getElementById('toggle-theme');
      
      toggleThemeBtn.addEventListener('click', () => {
        document.body.classList.toggle('dark-mode');
        
        if (document.body.classList.contains('dark-mode')) {
          toggleThemeBtn.textContent = '🌙 Modo Claro';
        } else {
          toggleThemeBtn.textContent = '☀️ Modo Escuro';
        }
      });

      // 2. FUNCIONALIDADE DO BOTÃO DE CURTIDA
      const likeBtn = document.getElementById('like-btn');
      const likeCount = document.getElementById('like-count');
      
      // Recupera o valor salvo no navegador ou inicia em 0
      let count = parseInt(localStorage.getItem('floresta_likes')) || 0;
      likeCount.textContent = count;

      likeBtn.addEventListener('click', () => {
        count++;
        likeCount.textContent = count;
        localStorage.setItem('floresta_likes', count);
      });
    });
  </script>

</body>
</html>
